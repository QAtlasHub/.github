name: Lint workflows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'actions/**']
  # Every pull request, not only those touching workflows: `actionlint` is this repo's required
  # check, and a required check that a README-only PR never runs leaves that PR unmergeable.
  # It takes seconds on a hosted runner.
  pull_request:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
