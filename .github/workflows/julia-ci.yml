# Reusable Julia CI with OPTIONAL sharding — a single `shards` input toggles it
# naturally:
#   shards: 1  (default)  -> one unsharded run (all tests)
#   shards: 16            -> fan out via test/ci/plan_shards.jl into 16 parallel shards
#
# Contract for sharded repos:
#   * `test/ci/plan_shards.jl <N> [timings.tsv]` prints a GitHub matrix JSON to
#     stdout: {"include":[{"sid":"s01","cases":"<selector>"}, ...]}  (N==1 => a
#     single {"sid":"all","cases":""}).
#   * the test suite reads env `CI_CASES` to pick which cases to run ("" = all).
#   * timings-informed LPT planning kicks in automatically when a `ci-timings`
#     orphan branch with timings.tsv exists (else deterministic round-robin).
#   * to PRODUCE that branch the suite must, when `CI_EMIT_TIMINGS=1`, write
#     `$CI_TIMINGS_DIR/timings-<something>.tsv` with one `key<TAB>seconds` row per
#     case (same key space `plan_shards.jl` uses). Both env vars are set by this
#     workflow on push:main only; PR and local runs never persist anything.
#     Without that emit the planner is round-robin FOREVER, not just on the first
#     run — `plan` now says so on every run instead of letting the fallback read
#     like a transient state.
#   * a caller with `shards > 1` needs `permissions: { contents: write }` so the
#     orphan branch can be pushed. Recording is best-effort and never reddens the
#     run (a bookkeeping job failing a whole CI run is its own footgun).
#
# Caller:
#   on: { push: { branches: [main] }, pull_request: {} }
#   jobs:
#     ci: { uses: QAtlasHub/.github/.github/workflows/julia-ci.yml@main, with: { shards: 16 } }
name: Julia CI (reusable)
on:
  workflow_call:
    inputs:
      shards:
        description: 'Number of test shards (1 = unsharded).'
        type: number
        default: 1
      julia-version:
        type: string
        default: '1'
      coverage:
        description: 'Process coverage and upload to Codecov (needs the CODECOV_TOKEN secret).'
        type: boolean
        default: true
      os:
        type: string
        default: 'ubuntu-latest'
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia-version }}
      - id: plan
        shell: bash
        run: |
          N=${{ inputs.shards }}
          if [ "$N" -gt 1 ] && [ -f test/ci/plan_shards.jl ]; then
            # timings-informed LPT bin-packing when the ci-timings branch exists,
            # else the planner falls back to round-robin.
            if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
              git fetch --depth=1 origin ci-timings \
                && git show FETCH_HEAD:timings.tsv > timings.tsv 2>/dev/null \
                || : > timings.tsv
              echo "Loaded $(wc -l < timings.tsv) timing rows from ci-timings."
            else
              : > timings.tsv
            fi
            # A missing/empty branch is a legitimate fallback, but it is only TRANSIENT if the
            # suite actually emits timings on push:main. Say so, every run: silence here is what
            # let round-robin masquerade as a first-run state indefinitely.
            if [ ! -s timings.tsv ]; then
              echo "::warning::no timing data — shard balance is round-robin, and PERMANENTLY so unless the suite writes \$CI_TIMINGS_DIR/timings-*.tsv when \$CI_EMIT_TIMINGS=1 (see this workflow's contract header) and the caller grants contents:write"
            fi
            matrix=$(julia --startup-file=no test/ci/plan_shards.jl "$N" timings.tsv)
            count=$(echo "$matrix" | jq 'length' 2>/dev/null || echo 0)
            if [ "${count:-0}" -eq 0 ]; then
              echo "::error::plan_shards.jl produced an empty plan"; exit 1
            fi
            echo "Planned $count shards."
          else
            if [ "$N" -gt 1 ]; then
              echo "::warning::shards=$N but test/ci/plan_shards.jl not found — running unsharded."
            fi
            matrix='[{"sid":"all","cases":""}]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: shard ${{ matrix.sid }}
    needs: plan
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia-version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: shard-${{ matrix.sid }}
          # a per-shard key; the default include-matrix serializes the whole
          # matrix context and corrupts the key (all shards recompiled).
          include-matrix: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Test (shard ${{ matrix.sid }})
        uses: julia-actions/julia-runtest@v1
        env:
          CI_CASES: ${{ matrix.cases }}
          # gated to push:main so PR and local runs never persist timings
          CI_EMIT_TIMINGS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.shards > 1) && '1' || '0' }}
          CI_TIMINGS_DIR: ${{ github.workspace }}/test/.ci-out
      - name: Upload shard timing (push:main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.shards > 1
        uses: actions/upload-artifact@v7
        with:
          name: timing-${{ matrix.sid }}
          path: test/.ci-out/timings-*.tsv
          retention-days: 1
          if-no-files-found: warn
          overwrite: true
          include-hidden-files: true
      - name: Process coverage
        if: ${{ inputs.coverage }}
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v7
        continue-on-error: true          # never fail CI on a flaky coverage upload
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: shard-${{ matrix.sid }}   # Codecov merges the per-shard uploads
          fail_ci_if_error: false

  record-timings:
    name: Record timing history
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.shards > 1 && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Best-effort bookkeeping. It must never redden a run whose tests all passed — a green suite
    # reported as `failure` because a timings push was denied trains everyone to ignore red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: timing-parts
          pattern: timing-*
      - name: Merge into the ci-timings orphan branch (latest value wins)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merged
          if git ls-remote --exit-code --heads origin ci-timings >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-timings
            git show FETCH_HEAD:timings.tsv > merged/timings.tsv 2>/dev/null || : > merged/timings.tsv
          else
            : > merged/timings.tsv
          fi
          find timing-parts -name 'timings-*.tsv' -exec cat {} + >> merged/timings.tsv 2>/dev/null || true
          awk -F'\t' 'NF==2{t[$1]=$2} END{for (k in t) print k"\t"t[k]}' \
            merged/timings.tsv | sort > merged/final.tsv
          rows=$(wc -l < merged/final.tsv)
          if [ "$rows" -lt 1 ]; then
            # NOT an error: a suite that does not implement the emit yet is a valid state, and
            # failing here would punish every such caller. But do not push an empty file either —
            # that would make `plan` load 0 rows and look like it succeeded.
            echo "::warning::0 timing rows — the suite did not write \$CI_TIMINGS_DIR/timings-*.tsv; leaving ci-timings untouched, shard balance stays round-robin"
            echo "0 timing rows collected — see this workflow's contract header." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Merged timing rows: $rows"
          tmp=$(mktemp -d)
          cp merged/final.tsv "$tmp/timings.tsv"
          cd "$tmp"
          git init -q
          git config user.email "ci@users.noreply.github.com"
          git config user.name "julia-ci"
          git checkout -q -b ci-timings
          git add timings.tsv
          git commit -q -m "ci: refresh test timings ($rows rows) [skip ci]"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            ci-timings
          echo "Pushed $rows timing rows to ci-timings." >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: All shards passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::one or more shards failed (${{ needs.test.result }})"; exit 1
          fi
          echo "✓ all shards passed"
