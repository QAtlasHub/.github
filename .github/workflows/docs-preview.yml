# Reusable: build the docs for a PR (Documenter push_preview) and post a sticky
# preview-URL comment. Caller:
#   on: { pull_request: {} }
#   jobs: { docs-preview: { uses: QAtlasHub/.github/.github/workflows/docs-preview.yml@main, secrets: inherit } }
name: Docs Preview (reusable)
on:
  workflow_call:
    inputs:
      julia-version:
        type: string
        default: '1'
      pre-build:
        type: string
        default: ''
      preview-base:
        description: >-
          Base URL where docs are served; the preview link is <base>/<repo>/previews/PR<N>/.
          Empty asks the Pages API where this repository's site actually is, which already
          accounts for a custom domain.
        type: string
        default: ''
    secrets:
      DOCUMENTER_KEY:
        required: false
permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia-version }}
      - name: Install docs environment
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Pre-build hook
        if: ${{ inputs.pre-build != '' }}
        run: julia --startup-file=no "${{ inputs.pre-build }}"
      - name: Build (deploydocs push_preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
      - name: Trigger GitHub Pages rebuild
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
      # The published URL is asked of GitHub rather than assembled from a constant. A constant
      # cannot know about a custom domain, and the one that was here —
      # `https://codes.sota-shimozono.com` — resolves to `sinkhole.paloaltonetworks.com`, so every
      # preview comment in a repository using the default pointed at an unreachable host.
      - name: Resolve the published site URL
        id: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ inputs.preview-base }}
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$BASE" ]; then
            root="${BASE%/}/$NAME"
          else
            root=$(gh api "repos/$REPO/pages" --jq '.html_url' 2>/dev/null || true)
            # Checked for SHAPE, not for exit code. With no Pages site `gh api` writes its 404 JSON
            # to STDOUT, `--jq` passes it through, and `|| true` hides the failure — measured on
            # templateHPC.jl, where the posted link began
            # `https://docs.github.com/rest/pages/pages#...","status":"404"}/previews/PR9/`.
            case "$root" in https://*) ;; *) root='' ;; esac
            # No Pages site yet, or no permission to read it: fall back to the host GitHub would
            # serve it from. Lowercased, because the owner may be spelled in mixed case.
            [ -n "$root" ] || root="https://$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]').github.io/$NAME"
          fi
          echo "url=${root%/}/previews/PR$PR/" >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Docs preview'
      - name: Post / update preview URL
        if: success()
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            📚 **Docs preview**: ${{ steps.site.outputs.url }}

            *(updates on each push to this PR)*
